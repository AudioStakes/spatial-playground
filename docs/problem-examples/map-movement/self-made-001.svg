<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Self-made map movement example 1</title>
  <desc id="desc">A small map with a path and destination marker.</desc>
  <rect width="800" height="500" fill="#fbfbf7"/>
  <rect x="60" y="50" width="680" height="400" rx="18" fill="#fff" stroke="#232323" stroke-width="4"/>
  <path d="M170 330 L250 250 L330 290 L410 200 L510 260 L600 180" fill="none" stroke="#1f4b99" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="170" cy="330" r="16" fill="none" stroke="#5b8c3f" stroke-width="6"/>
  <circle cx="600" cy="180" r="16" fill="none" stroke="#d44a3a" stroke-width="6"/>
  <path d="M600 180 L582 170 L584 190 Z" fill="#d44a3a"/>
</svg>
