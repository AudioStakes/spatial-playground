  <circle cx="400" cy="250" r="40" fill="none" stroke="#232323" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M400 120 L400 70" stroke="#7b7b7b" stroke-width="4" stroke-linecap="round"/>
  <path d="M400 70 L388 92 L412 92 Z" fill="#7b7b7b"/>
