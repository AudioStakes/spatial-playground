<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Self-made layering example 2</title>
  <desc id="desc">Three stacked shapes suggest hidden edges and visible overlaps.</desc>
  <rect width="800" height="500" fill="#fbfbf7"/>
  <rect x="60" y="50" width="680" height="400" rx="18" fill="#fff" stroke="#232323" stroke-width="4"/>
  <circle cx="290" cy="240" r="90" fill="none" stroke="#1f4b99" stroke-width="10"/>
  <rect x="350" y="150" width="200" height="180" rx="18" fill="none" stroke="#d44a3a" stroke-width="10"/>
  <path d="M470 110 L600 240 L470 370" fill="none" stroke="#5b8c3f" stroke-width="10" stroke-linejoin="round"/>
  <path d="M320 240 C360 240, 390 240, 430 240" fill="none" stroke="#7b7b7b" stroke-width="4" stroke-linecap="round"/>
  <path d="M430 240 L412 230 L414 250 Z" fill="#7b7b7b"/>
</svg>
