<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Self-made layering example 1</title>
  <desc id="desc">Overlapping paper shapes show front and back relationships.</desc>
  <rect width="800" height="500" fill="#fbfbf7"/>
  <rect x="70" y="60" width="660" height="380" rx="18" fill="#fff" stroke="#232323" stroke-width="4"/>
  <rect x="180" y="160" width="220" height="180" rx="18" fill="none" stroke="#1f4b99" stroke-width="10"/>
  <rect x="320" y="120" width="220" height="180" rx="18" fill="none" stroke="#d44a3a" stroke-width="10"/>
  <rect x="460" y="180" width="160" height="160" rx="18" fill="none" stroke="#5b8c3f" stroke-width="10"/>
  <path d="M290 250 C335 250, 370 250, 430 250" fill="none" stroke="#7b7b7b" stroke-width="4" stroke-linecap="round"/>
  <path d="M430 250 L412 240 L414 260 Z" fill="#7b7b7b"/>
  <circle cx="230" cy="210" r="14" fill="none" stroke="#1f4b99" stroke-width="5"/>
  <circle cx="560" cy="210" r="14" fill="none" stroke="#5b8c3f" stroke-width="5"/>
</svg>
