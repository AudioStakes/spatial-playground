<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Self-made dot figure example 1</title>
  <desc id="desc">A small set of dots is connected to form a simple shape.</desc>
  <rect width="800" height="500" fill="#fbfbf7"/>
  <rect x="60" y="50" width="680" height="400" rx="18" fill="#fff" stroke="#232323" stroke-width="4"/>
  <path d="M250 310 L340 190 L430 310 Z" fill="none" stroke="#1f4b99" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="250" cy="310" r="10" fill="#232323"/>
  <circle cx="340" cy="190" r="10" fill="#232323"/>
  <circle cx="430" cy="310" r="10" fill="#232323"/>
  <circle cx="340" cy="310" r="10" fill="#232323"/>
  <path d="M480 250 C520 250, 550 250, 600 250" fill="none" stroke="#7b7b7b" stroke-width="4" stroke-linecap="round"/>
  <path d="M600 250 L582 240 L584 260 Z" fill="#7b7b7b"/>
</svg>
