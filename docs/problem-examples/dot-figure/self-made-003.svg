<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Self-made dot figure example 3</title>
  <desc id="desc">A symmetric dot pattern is shown around a vertical axis.</desc>
  <rect width="800" height="500" fill="#fbfbf7"/>
  <rect x="60" y="50" width="680" height="400" rx="18" fill="#fff" stroke="#232323" stroke-width="4"/>
  <line x1="400" y1="100" x2="400" y2="400" stroke="#b7b7b0" stroke-width="4" stroke-dasharray="14 10"/>
  <circle cx="300" cy="180" r="9" fill="#232323"/>
  <circle cx="340" cy="140" r="9" fill="#232323"/>
  <circle cx="340" cy="220" r="9" fill="#232323"/>
  <circle cx="500" cy="180" r="9" fill="#232323"/>
  <circle cx="460" cy="140" r="9" fill="#232323"/>
  <circle cx="460" cy="220" r="9" fill="#232323"/>
  <path d="M300 180 L340 140 L340 220 L300 180" fill="none" stroke="#1f4b99" stroke-width="6" stroke-linejoin="round"/>
  <path d="M500 180 L460 140 L460 220 L500 180" fill="none" stroke="#d44a3a" stroke-width="6" stroke-linejoin="round"/>
</svg>
