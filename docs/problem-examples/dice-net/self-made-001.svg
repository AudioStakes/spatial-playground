<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Self-made dice net example 1</title>
  <desc id="desc">A cube net is drawn as connected squares with fold lines.</desc>
  <rect width="800" height="500" fill="#fbfbf7"/>
  <rect x="60" y="50" width="680" height="400" rx="18" fill="#fff" stroke="#232323" stroke-width="4"/>
  <g fill="none" stroke="#1f4b99" stroke-width="8">
    <rect x="250" y="150" width="70" height="70"/>
    <rect x="320" y="150" width="70" height="70"/>
    <rect x="390" y="150" width="70" height="70"/>
    <rect x="320" y="220" width="70" height="70"/>
    <rect x="320" y="290" width="70" height="70"/>
    <rect x="180" y="220" width="70" height="70"/>
  </g>
  <path d="M285 185 L285 185" stroke="#d44a3a" stroke-width="10"/>
  <circle cx="285" cy="185" r="10" fill="none" stroke="#d44a3a" stroke-width="6"/>
  <circle cx="355" cy="255" r="10" fill="none" stroke="#5b8c3f" stroke-width="6"/>
  <path d="M500 250 C540 250, 570 250, 620 250" fill="none" stroke="#7b7b7b" stroke-width="4" stroke-linecap="round"/>
  <path d="M620 250 L602 240 L604 260 Z" fill="#7b7b7b"/>
</svg>
