<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Self-made maze example 1</title>
  <desc id="desc">A tiny paper maze shows a start, path, and goal.</desc>
  <rect width="800" height="500" fill="#fbfbf7"/>
  <rect x="60" y="50" width="680" height="400" rx="18" fill="#fff" stroke="#232323" stroke-width="4"/>
  <path d="M180 150 H300 V220 H240 V300 H360 V370 H520" fill="none" stroke="#1f4b99" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="180" cy="150" r="16" fill="none" stroke="#5b8c3f" stroke-width="6"/>
  <circle cx="520" cy="370" r="16" fill="none" stroke="#d44a3a" stroke-width="6"/>
  <path d="M520 370 L502 360 L504 380 Z" fill="#d44a3a"/>
</svg>
