<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Self-made mirror reference</title>
  <desc id="desc">A simple shape is shown on one side of a mirror axis with its reflected counterpart on the other side.</desc>
  <rect width="800" height="500" fill="#fbfbf7"/>
  <rect x="50" y="40" width="700" height="420" rx="20" fill="#fff" stroke="#232323" stroke-width="4"/>
  <line x1="400" y1="70" x2="400" y2="430" stroke="#b7b7b0" stroke-width="4" stroke-dasharray="14 10"/>
  <path d="M210 360 L210 160 L270 160 L270 220 L330 220 L330 360 Z" fill="none" stroke="#1f4b99" stroke-width="12" stroke-linejoin="round"/>
  <path d="M590 360 L590 160 L530 160 L530 220 L470 220 L470 360 Z" fill="none" stroke="#d44a3a" stroke-width="12" stroke-linejoin="round"/>
  <circle cx="210" cy="120" r="24" fill="none" stroke="#1f4b99" stroke-width="8"/>
  <circle cx="590" cy="120" r="24" fill="none" stroke="#d44a3a" stroke-width="8"/>
  <path d="M260 270 C300 250, 320 250, 360 270" fill="none" stroke="#7b7b7b" stroke-width="4" stroke-linecap="round"/>
  <path d="M360 270 L342 260 L344 280 Z" fill="#7b7b7b"/>
  <path d="M540 270 C500 250, 480 250, 440 270" fill="none" stroke="#7b7b7b" stroke-width="4" stroke-linecap="round"/>
  <path d="M440 270 L458 260 L456 280 Z" fill="#7b7b7b"/>
</svg>
