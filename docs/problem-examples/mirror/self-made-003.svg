<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Self-made mirror example 3</title>
  <desc id="desc">A vertical mirror line completes an asymmetric shape into a symmetric one.</desc>
  <rect width="800" height="500" fill="#fbfbf7"/>
  <rect x="60" y="50" width="680" height="400" rx="18" fill="#fff" stroke="#232323" stroke-width="4"/>
  <line x1="400" y1="70" x2="400" y2="430" stroke="#b7b7b0" stroke-width="4" stroke-dasharray="14 10"/>
  <path d="M240 350 L240 170 L300 170 L300 230 L350 230 L350 350 Z" fill="none" stroke="#1f4b99" stroke-width="12" stroke-linejoin="round"/>
  <path d="M560 350 L560 170 L500 170 L500 230 L450 230 L450 350 Z" fill="none" stroke="#d44a3a" stroke-width="12" stroke-linejoin="round"/>
  <circle cx="210" cy="120" r="18" fill="none" stroke="#1f4b99" stroke-width="6"/>
  <circle cx="590" cy="120" r="18" fill="none" stroke="#d44a3a" stroke-width="6"/>
</svg>
