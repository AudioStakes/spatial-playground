  <path d="M180 150 L230 150 L230 210 L260 210 L260 180 L310 180 L310 150 L360 150" fill="none" stroke="#1f4b99" stroke-width="12" stroke-linejoin="round"/>
  <path d="M180 350 L230 350 L230 290 L260 290 L260 320 L310 320 L310 350 L360 350" fill="none" stroke="#d44a3a" stroke-width="12" stroke-linejoin="round" opacity="0.95"/>
  <circle cx="520" cy="160" r="34" fill="none" stroke="#1f4b99" stroke-width="8"/>
