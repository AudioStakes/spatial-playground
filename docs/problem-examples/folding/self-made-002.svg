<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Self-made folding example 2</title>
  <desc id="desc">A paper sheet with a central crease and a hidden mark that duplicates after unfolding.</desc>
