  <path d="M140 120 L400 120 L400 380 L140 380 Z" fill="#f5f5f0" stroke="#232323" stroke-width="3"/>
  <path d="M400 120 L660 120 L660 380 L400 380 Z" fill="#fff" stroke="#232323" stroke-width="3"/>
  <circle cx="315" cy="250" r="22" fill="none" stroke="#1f4b99" stroke-width="8"/>
  <circle cx="485" cy="250" r="22" fill="none" stroke="#d44a3a" stroke-width="8"/>
  <path d="M400 140 L455 190" stroke="#7b7b7b" stroke-width="4" stroke-linecap="round"/>
  <path d="M455 190 L433 188 L443 170 Z" fill="#7b7b7b"/>
