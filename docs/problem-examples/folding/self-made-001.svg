  <path d="M160 120 L400 120 L400 380 L160 380 Z" fill="#f5f5f0" stroke="#232323" stroke-width="3"/>
  <path d="M400 120 L640 120 L640 380 L400 380 Z" fill="#fff" stroke="#232323" stroke-width="3"/>
  <path d="M310 250 L335 225 L360 250 L335 275 Z" fill="none" stroke="#1f4b99" stroke-width="10" stroke-linejoin="round"/>
  <path d="M490 250 L465 225 L440 250 L465 275 Z" fill="none" stroke="#d44a3a" stroke-width="10" stroke-linejoin="round"/>
  <path d="M400 130 L470 180" fill="none" stroke="#7b7b7b" stroke-width="4" stroke-linecap="round"/>
  <path d="M470 180 L448 178 L458 160 Z" fill="#7b7b7b"/>
